spring:
  application:
    name: sndc-ims-backend
  config:
    # 若 backend/.env 存在則讀取（KEY=VALUE 格式）；環境變數優先權較高
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/sndc_ims}
    username: ${DATABASE_USERNAME:sndc}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # Schema 只由 Flyway 管理
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Excel／CSV 匯入上限（規格書第 4.6 節）
      max-file-size: 10MB
      max-request-size: 11MB
server:
  # 只監聽本機；手機經 tailscale serve 以 HTTPS 轉發進來（規格書第 2.6 節）
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

app:
  timezone: ${APP_TIMEZONE:UTC}
  auth:
    # 必填：至少 32 個字元的隨機字串（HS256）
    jwt-secret: ${JWT_SECRET:}
    jwt-expiration: ${JWT_EXPIRATION:PT12H}
    # 必填：團部通行碼，只用於註冊資格驗證
    registration-code: ${DEPARTMENT_REGISTRATION_CODE:}
    max-failed-logins: 5
    lockout-duration: PT15M
  ai:
    # 選填：未設定時 AI 助理會回傳「AI 服務未設定」，其他功能不受影響
    groq-api-key: ${GROQ_API_KEY:}
    groq-model: ${GROQ_MODEL:openai/gpt-oss-120b}
    groq-base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    # gpt-oss 系列可設 low／medium／high；其他模型請留空
    reasoning-effort: ${GROQ_REASONING_EFFORT:low}
    timeout: PT30S
  base-url: ${APP_BASE_URL:http://localhost:8080}
  paging:
    default-size: 20
    max-size: 100

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
